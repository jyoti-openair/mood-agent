services:
  web:
    build: .
    container_name: mood-agent
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - SYSTEM_ROOT_DIRECTORY=/app/.cognee
      - DATA_ROOT_DIRECTORY=/app/.cognee
    volumes:
      - .:/app                 # Syncs code changes
      - ./.cognee:/app/.cognee # Persists ingested SQLite/graph databases on host
      - ./pdfs:/app/pdfs